<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>עלוני שבת</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell" data-mode="tabs">
      <header class="topbar">
        <div class="topbar-titles">
          <h1 class="topbar-title">עלוני שבת</h1>
          <span class="topbar-subtitle"></span>
        </div>
        <div class="topbar-actions"></div>
      </header>
      <!-- פס הסנכרון: מופיע רק בזמן עדכון, בלי חלון קופץ. -->
      <div class="sync-bar" hidden><div class="sync-bar-fill"></div></div>
      <!-- הלשוניות הראשיות. הכפתורים נבנים ב-alonim-ui-shell.js. -->
      <div class="main-tabs" role="tablist"></div>
      <main class="app-content">
        <div class="content-column" id="main-panel" role="tabpanel">
          <!-- שלד עד שהאפליקציה עולה (בלי טקסט). -->
          <div class="skeleton-list" aria-hidden="true">
            <div class="skeleton-card">
              <span class="skeleton-line is-title"></span><span class="skeleton-line is-meta"></span
              ><span class="skeleton-line is-chips"></span>
            </div>
            <div class="skeleton-card">
              <span class="skeleton-line is-title"></span><span class="skeleton-line is-meta"></span
              ><span class="skeleton-line is-chips"></span>
            </div>
            <div class="skeleton-card">
              <span class="skeleton-line is-title"></span><span class="skeleton-line is-meta"></span
              ><span class="skeleton-line is-chips"></span>
            </div>
          </div>
        </div>
      </main>
      <!-- צפיין ה-PDF: מחליף את הלשוניות כשגיליון פתוח. -->
      <section class="viewer" hidden aria-label="צפיין"></section>
    </div>

    <div class="toasts"></div>
    <!-- אזור קבוע לקורא מסך: אזור שנוצר זה עתה אינו מוכרז. -->
    <div class="live-region visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <!-- סדר הטעינה: תרגום ← לוגיקה טהורה ← שכבות ← רכיבים ← מסכים ← בקר ← כניסה. -->
    <script src="js/alonim-i18n.js"></script>
    <script src="i18n/en.js"></script>
    <script src="js/alonim-hebcal.js"></script>
    <script src="js/alonim-core.js"></script>
    <script src="js/alonim-normalize.js"></script>
    <script src="js/alonim-log.js"></script>
    <script src="js/alonim-runtime.js"></script>
    <script src="js/alonim-capabilities.js"></script>
    <script src="js/alonim-errors.js"></script>
    <script src="js/alonim-theme.js"></script>
    <script src="js/alonim-icons.js"></script>
    <script src="js/alonim-weeks.js"></script>
    <script src="js/alonim-rules.js"></script>
    <script src="js/alonim-filters.js"></script>
    <script src="js/alonim-index.js"></script>
    <script src="js/alonim-index-search.js"></script>
    <script src="js/alonim-cycle.js"></script>
    <script src="js/alonim-state-schema.js"></script>
    <script src="js/alonim-state.js"></script>
    <script src="js/alonim-catalog.js"></script>
    <script src="js/alonim-files.js"></script>
    <script src="js/alonim-bulk.js"></script>
    <script src="js/alonim-storage.js"></script>
    <script src="js/alonim-diagnostics.js"></script>
    <script src="js/alonim-ui.js"></script>
    <script src="js/alonim-ui-overlays.js"></script>
    <script src="js/alonim-ui-vlist.js"></script>
    <script src="js/alonim-ui-cards.js"></script>
    <script src="js/alonim-ui-dates.js"></script>
    <script src="js/alonim-ui-week.js"></script>
    <script src="js/alonim-ui-weekpicker.js"></script>
    <script src="js/alonim-ui-browse.js"></script>
    <script src="js/alonim-ui-select.js"></script>
    <script src="js/alonim-ui-filters.js"></script>
    <script src="js/alonim-ui-all.js"></script>
    <script src="js/alonim-ui-mine.js"></script>
    <script src="js/alonim-ui-detail.js"></script>
    <script src="js/alonim-ui-viewer.js"></script>
    <script src="js/alonim-ui-storage.js"></script>
    <script src="js/alonim-ui-help.js"></script>
    <script src="js/alonim-ui-diagnostics.js"></script>
    <script src="js/alonim-ui-settings.js"></script>
    <script src="js/alonim-ui-settings-rules.js"></script>
    <script src="js/alonim-ui-settings-backup.js"></script>
    <script src="js/alonim-app.js"></script>
    <script src="js/alonim-boundary.js"></script>
    <script src="js/alonim-ui-shell.js"></script>
    <script src="js/alonim-main.js"></script>
  </body>
</html>
