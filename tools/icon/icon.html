<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- סמל מקורי: גיליון שבת (דף עם שורות) ולהבת נר, בזהב של אוצריא. 64x64. -->
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9a6a1c" />
          <stop offset="1" stop-color="#6b440a" />
        </linearGradient>
        <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe9a8" />
          <stop offset="1" stop-color="#f4a32b" />
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" />
      <!-- הדף האחורי: גיליון שני, מוטה מעט -->
      <rect x="15" y="17" width="28" height="36" rx="4" fill="#f1d9a6" transform="rotate(-7 29 35)" />
      <!-- הדף הקדמי -->
      <path d="M20 14h20l8 8v26a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4z" fill="#fff8ec" />
      <path d="M40 14v6a2 2 0 0 0 2 2h6z" fill="#e3c88f" />
      <rect x="21" y="27" width="22" height="3" rx="1.5" fill="#9a6a1c" />
      <rect x="21" y="34" width="18" height="2.6" rx="1.3" fill="#c79a4e" />
      <rect x="21" y="40" width="21" height="2.6" rx="1.3" fill="#c79a4e" />
      <rect x="21" y="46" width="12" height="2.6" rx="1.3" fill="#c79a4e" />
      <!-- נר שבת קטן עם להבה, בפינה -->
      <rect x="45" y="36" width="6" height="15" rx="2" fill="#fff8ec" />
      <path d="M48 24c3 3.2 4.4 5.6 4.4 8a4.4 4.4 0 0 1-8.8 0c0-1.7.9-3 1.9-4.2.5 1.2 1.2 1.7 1.9 1.7-.5-2 .1-3.6.6-5.5z" fill="url(#flame)" />
    </svg>
  </body>
</html>
